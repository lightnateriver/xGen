name: Framework quality

on:
  pull_request:
  push:
    branches: [v0.6, v0.7]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cpu-quality:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # Existing compatibility tests use a published source baseline.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements-quality.txt
      - name: Install development checks
        run: python -m pip install -r requirements-quality.txt
      - name: Check lint, syntax and self-contained CPU tests
        run: python tools/check_quality.py
  cpu-tp:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install CPU tensor runtime
        run: python -m pip install torch==2.6.0+cpu --index-url https://download.pytorch.org/whl/cpu
      - name: Check TP partitioning and projection numerics
        run: python tests/test_tp_projections_cpu.py
      - name: Check multi-process failure propagation
        run: python tests/test_distributed_failure_cpu.py
